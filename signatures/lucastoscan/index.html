<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucas Toscan | Solvi</title>
</head>

<body style="margin:0;padding:6px;background:#ffffff;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0"
  style="
    width:364px;
    max-width:100%;
    border:1px solid #c9cdd2;
    border-radius:12px;
    border-collapse:separate;
    border-spacing:0;
    background:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
    color:#18212c;
  ">

  <tr>

    <!-- FOTO -->
    <td valign="middle" style="width:60px;padding:10px;">
      <img
        src="https://solvi.ia.br/signatures/lucastoscan/lucastoscan.jpg"
        width="60"
        height="60"
        alt="Lucas Toscan"
        style="
          display:block;
          width:60px;
          height:60px;
          border-radius:50%;
          object-fit:cover;
          border:1px solid #8ea6a0;
        ">
    </td>

    <!-- BARRA 1 -->
    <td
      width="1"
      style="
        width:1px;
        background:#bfc4ca;
        font-size:1px;
        line-height:1px;
      ">
      &nbsp;
    </td>

    <!-- NOME / CARGO / EMAIL -->
    <td valign="middle" style="padding:10px 14px 10px 12px;">

      <div style="
        font-size:16px;
        line-height:19px;
        font-weight:700;
        color:#18212c;
        white-space:nowrap;
      ">
        Lucas Toscan
      </div>

      <div style="
        margin-top:3px;
        font-size:11px;
        line-height:14px;
        font-weight:700;
        color:#5b22d3;
        white-space:nowrap;
      ">
        CEO &amp; Fundador
      </div>

      <div style="
        margin-top:6px;
        font-size:12px;
        line-height:15px;
        white-space:nowrap;
      ">
        <a
          href="mailto:lucas@solvi.ia.br?subject=%5Bresposta%5D"
          style="
            color:#376b9a;
            text-decoration:none;
          ">
          lucas@solvi.ia.br
        </a>
      </div>

    </td>

    <!-- BARRA 2 -->
    <td
      width="1"
      style="
        width:1px;
        background:#bfc4ca;
        font-size:1px;
        line-height:1px;
      ">
      &nbsp;
    </td>

    <!-- LOGO SOLVI -->
    <td valign="middle" style="padding:10px 10px 10px 8px;">

      <a
        href="https://solvi.ia.br"
        target="_blank"
        style="text-decoration:none;border:0;"
      >
        <img
          src="https://solvi.ia.br/signatures/lucastoscan/logosolvi.png"
          width="118"
          alt="Solvi - Inteligência que resolve"
          style="
            display:block;
            width:118px;
            height:auto;
            border:0;
          ">
      </a>

    </td>

  </tr>
</table>

</body>
</html>
