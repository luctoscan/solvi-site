<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assinatura Lucas Toscan | Solvi</title>
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{padding:10px;font-family:Arial,Helvetica,sans-serif}
  .signature-shell{
    width:100%;
    max-width:920px;
    box-sizing:border-box;
    border:2px solid #A7AFBA;
    border-radius:20px;
    background:#fff;
    overflow:hidden;
  }
  .signature-row{
    width:100%;
    border-collapse:collapse;
    table-layout:auto;
  }
  .photo-cell{width:150px;padding:14px 16px;vertical-align:middle}
  .photo{
    display:block;
    width:128px;
    height:128px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #18A66B;
    outline:2px solid #4B19DA;
  }
  .separator{width:2px;background:#A7AFBA;font-size:1px;line-height:1px}
  .data-cell{padding:12px 20px;vertical-align:middle;min-width:300px}
  .name{font-size:28px;line-height:31px;font-weight:700;color:#07111F;white-space:nowrap}
  .role{margin-top:3px;font-size:17px;line-height:21px;font-weight:700;color:#4B19DA;white-space:nowrap}
  .role span{color:#0A6A3B}
  .desc{margin-top:2px;font-size:15px;line-height:19px;color:#4B19DA;white-space:nowrap}
  .contacts{margin-top:10px;border-collapse:collapse}
  .contact-row td{vertical-align:middle;padding-bottom:5px}
  .contact-icon{width:26px;height:26px;display:block;border:0}
  .contact-link{font-size:14px;line-height:18px;font-weight:700;text-decoration:none;white-space:nowrap}
  .email-link{color:#1459A6}
  .wa-link{color:#0A6A3B}
  .logo-cell{padding:12px 18px;vertical-align:middle;text-align:center;width:270px}
  .logo{display:block;width:250px;max-width:100%;height:auto;border:0;margin:auto}

  @media only screen and (max-width:700px){
    body{padding:6px}
    .signature-shell{border-radius:16px}
    .signature-row,
    .signature-row tbody,
    .signature-row tr,
    .signature-row td{
      display:block;
      width:100%!important;
      box-sizing:border-box;
    }
    .photo-cell{padding:16px 16px 10px;text-align:center}
    .photo{width:96px;height:96px;margin:0 auto}
    .separator{
      height:1px!important;
      min-height:1px;
      padding:0!important;
      background:#A7AFBA;
    }
    .data-cell{min-width:0;padding:14px 18px;text-align:center}
    .name{font-size:23px;line-height:26px;white-space:normal}
    .role{font-size:15px;line-height:19px;white-space:normal}
    .desc{font-size:13px;line-height:17px;white-space:normal}
    .contacts{margin:10px auto 0}
    .contact-link{font-size:13px;white-space:normal}
    .logo-cell{padding:14px 18px 16px}
    .logo{width:190px}
  }

  @media only screen and (max-width:390px){
    .signature-shell{border-radius:14px}
    .photo{width:82px;height:82px}
    .data-cell{padding-left:12px;padding-right:12px}
    .name{font-size:21px;line-height:24px}
    .logo{width:165px}
  }
</style>
</head>
<body>
<table class="signature-shell" cellpadding="0" cellspacing="0" border="0" role="presentation">
  <tr>
    <td style="padding:0">
      <table class="signature-row" cellpadding="0" cellspacing="0" border="0" role="presentation">
        <tr>
          <td class="photo-cell">
            <img class="photo" src="https://solvi.ia.br/assinaturas/Lucas-Toscan/lucas-toscan.jpg" alt="Lucas Toscan">
          </td>

          <td class="separator">&nbsp;</td>

          <td class="data-cell">
            <div class="name">Lucas Toscan</div>
            <div class="role">CEO &amp; Fundador <span>| Solvi</span></div>
            <div class="desc">Inteligência Artificial &amp; Automação</div>

            <table class="contacts" cellpadding="0" cellspacing="0" border="0" role="presentation">
              <tr class="contact-row">
                <td style="padding-right:8px">
                  <a href="mailto:lucas@solvi.ia.br">
                    <img class="contact-icon" src="https://solvi.ia.br/assinaturas/Lucas-Toscan/email.png" alt="E-mail">
                  </a>
                </td>
                <td>
                  <a class="contact-link email-link" href="mailto:lucas@solvi.ia.br">lucas@solvi.ia.br</a>
                </td>
              </tr>
              <tr class="contact-row">
                <td style="padding-right:8px;padding-bottom:0">
                  <a href="https://wa.me/5554996349062" target="_blank" rel="noopener">
                    <img class="contact-icon" src="https://solvi.ia.br/assinaturas/Lucas-Toscan/whatsapp.png" alt="WhatsApp">
                  </a>
                </td>
                <td style="padding-bottom:0">
                  <a class="contact-link wa-link" href="https://wa.me/5554996349062" target="_blank" rel="noopener">(54) 99634-9062</a>
                </td>
              </tr>
            </table>
          </td>

          <td class="separator">&nbsp;</td>

          <td class="logo-cell">
            <a href="https://solvi.ia.br" target="_blank" rel="noopener">
              <img class="logo" src="https://solvi.ia.br/assinaturas/Lucas-Toscan/logo-solvi.png" alt="Solvi — Inteligência que resolve.">
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
